services:
  nginx:
    image: nginx:alpine
    container_name: tp_web 
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - global_proxy 
      - tp_network  
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tp_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - tp_network

  db:
    image: mysql:8.0
    container_name: tp_db 
    restart: always
    environment:
      MYSQL_DATABASE: ticketpro_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password123}
    volumes:
      - tp_db_data:/var/lib/mysql
    networks:
      - tp_network

networks:
  tp_network:
    driver: bridge
  global_proxy:
    external: true 

volumes:
  tp_db_data: